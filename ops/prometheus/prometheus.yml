global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: moment-api
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 5146
        refresh_interval: 5s

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113
