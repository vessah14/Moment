worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_public_write:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @rate_limited;

    upstream moment_api {
        zone moment_api 64k;
        server api:5146 resolve;
        keepalive 32;
    }

    server {
        listen 5146;
        client_max_body_size 30m;

        location = /metrics {
            return 404;
        }

        location = /stub_status {
            return 404;
        }

        location ~ ^/api/(?:users|admin/accounts)/login(?:/mfa)?$ {
            limit_req zone=api_general burst=30 nodelay;
            limit_req zone=api_login burst=5 nodelay;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/public/(?:events/[^/]+/rsvp|invitations/[^/]+/rsvp)$ {
            limit_req zone=api_general burst=30 nodelay;
            limit_req zone=api_public_write burst=5 nodelay;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            include /etc/nginx/proxy_params;
        }

        location / {
            include /etc/nginx/proxy_params;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Trop de requêtes. Réessayez dans un instant."}';
        }
    }

    server {
        listen 8080;
        location = /stub_status {
            stub_status;
        }
    }
}
